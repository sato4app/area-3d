<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Area3D</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="app-body" id="appBody">
    <!-- 地図と3Dビュー（右上のボタンで切り替え） -->
    <main class="views" id="views">
      <div class="view" id="mapView">
        <div id="map"></div>
      </div>
      <div class="view" id="viewerView">
        <div id="viewer"></div>
        <div id="hover" class="hover hidden"></div>
        <div id="progress" class="progress hidden"></div>
        <div id="placeholder" class="placeholder">領域を指定して「3D表示」を押してください</div>
        <div class="attribution">出典：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a></div>
      </div>
    </main>

    <!-- 地図／3D の切り替えボタン -->
    <button id="viewToggle" class="view-toggle" title="3D表示に切り替え">3D</button>

    <!-- コントロールパネル（地図の上に浮かぶ・どちらかの見出しをドラッグでまとめて移動） -->
    <div class="panel-stack" id="panelStack">
    <aside class="panel" id="filePanel">
      <div class="panel-header" id="filePanelHeader" title="ドラッグで移動">
        <h2 class="panel-title">ファイル読み込み</h2>
        <button id="filePanelToggle" class="icon-btn" title="折りたたむ" aria-expanded="true">−</button>
      </div>

      <div class="panel-body">
        <label class="file-btn">
          GeoJSONファイルを選択
          <input type="file" id="geojsonInput" accept=".geojson,.json,application/geo+json" multiple hidden>
        </label>
        <p class="hint">ファイル名をクリックするとその範囲へ移動します。</p>
        <ul id="fileList" class="file-list"></ul>
      </div>
    </aside>

    <aside class="panel" id="panel">
      <div class="panel-header" id="panelHeader" title="ドラッグで移動">
        <h1 class="panel-title">Area3D <span>指定領域の3D表示</span></h1>
        <button id="panelToggle" class="icon-btn" title="折りたたむ" aria-expanded="true">−</button>
      </div>

      <div class="panel-body">
        <section>
          <h2>場所を検索</h2>
          <form id="searchForm" class="search-row">
            <input type="text" id="searchInput" placeholder="地名・山名・住所">
            <button type="submit">検索</button>
          </form>
          <ul id="searchResults" class="search-results"></ul>
        </section>

        <section>
          <h2>中心点</h2>
          <p class="hint">地図上のマーカーをドラッグして指定</p>
          <div class="field-grid">
            <label>緯度<input type="number" id="lat" step="0.000001"></label>
            <label>経度<input type="number" id="lon" step="0.000001"></label>
          </div>
        </section>

        <section>
          <h2>領域サイズ</h2>
          <div class="field-grid">
            <label>横 x (m)<input type="number" id="width" min="100" max="20000" step="100"></label>
            <label>縦 y (m)<input type="number" id="height" min="100" max="20000" step="100"></label>
          </div>
        </section>

        <section>
          <h2>表示設定</h2>
          <label class="field">ベース地図
            <select id="layer"></select>
          </label>
          <label class="field">重ねる地図（半透明）
            <select id="overlay">
              <option value="">なし</option>
            </select>
          </label>
          <label class="field">
            <span>重ねる濃さ <output id="overlayOpacityOut">50</output>%</span>
            <input type="range" id="overlayOpacity" min="0" max="100" step="5" value="50">
          </label>
          <p class="hint">濃さは3D表示後もすぐ反映されます。地図の種類を変えたときは「3D表示」を押し直してください。</p>
          <label class="field">標高データ
            <select id="dem">
              <option value="dem1a">1mメッシュ（無い所は5m・10mで補完）</option>
              <option value="dem5a" selected>5mメッシュ（無い所は10mで補完）</option>
              <option value="dem10b">10mメッシュ</option>
            </select>
          </label>
          <p class="hint" id="demHint">1mメッシュは領域が横・縦とも500m以下のときだけ選べます。</p>
          <label class="field">テクスチャ解像度
            <select id="texSize">
              <option value="2048">標準（最大2048px）</option>
              <option value="4096" selected>高（最大4096px）</option>
            </select>
          </label>
        </section>

        <button id="buildBtn" class="primary">3D表示</button>

        <section>
          <h2>高さ強調 <output id="exagOut">1.0</output> 倍</h2>
          <input type="range" id="exag" min="1" max="5" step="0.1" value="1">
        </section>

        <section class="actions">
          <button id="resetViewBtn">視点リセット</button>
          <button id="shotBtn">画像保存</button>
        </section>

        <section>
          <h2>情報</h2>
          <dl id="info" class="info"></dl>
        </section>
      </div>
    </aside>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
